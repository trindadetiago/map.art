name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jp
          POSTGRES_PASSWORD: jp
          POSTGRES_DB: jp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://jp:jp@localhost:5432/jp
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci-secret
      S3_BUCKET: ci-bucket
      S3_FORCE_PATH_STYLE: "true"
      GOOGLE_MAPS_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      worker_render: ${{ steps.filter.outputs.worker_render }}
      worker_stylize: ${{ steps.filter.outputs.worker_stylize }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            web:
              - *shared
              - 'apps/web/**'
            worker_render:
              - *shared
              - 'apps/worker-render/**'
            worker_stylize:
              - *shared
              - 'apps/worker-stylize/**'

  deploy:
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy web
        if: needs.changes.outputs.web == 'true'
        run: railway up --ci --service web
      - name: Deploy worker-render
        if: needs.changes.outputs.worker_render == 'true'
        run: railway up --ci --service worker-render
      - name: Deploy worker-stylize
        if: needs.changes.outputs.worker_stylize == 'true'
        run: railway up --ci --service worker-stylize
