services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mapart
      MINIO_ROOT_PASSWORD: mapartstorage
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 mapart mapartstorage >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 1;
      done &&
      mc mb --ignore-existing local/mapart &&
      exit 0;
      "

volumes:
  minio_data:
